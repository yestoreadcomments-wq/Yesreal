<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tuff Sound Uploader For Guesting Hub</title>
<style>
body { font-family: Arial; background:#fff; color:#000; display:flex; flex-direction:column; align-items:center; padding:20px; }
h1 { text-align:center; margin-bottom:5px; font-size:1.5rem; }
h2 { font-size:0.85rem; margin-bottom:20px; text-align:center; }
form { width:90%; max-width:400px; display:flex; flex-direction:column; gap:10px; }
input[type="file"] { padding:20px; font-size:1.1rem; }
button { padding:12px; font-size:1rem; cursor:pointer; margin-top:10px; }
#linkBox, #copyBtn, #copyNote { display:none; width:100%; max-width:400px; margin-top:10px; }
#linkBox { padding:8px; font-family:monospace; font-size:0.9rem; }
#copyBtn { padding:8px; font-size:0.9rem; margin-top:5px; }
#copyNote { font-size:0.85rem; margin-top:5px; }
</style>
</head>
<body>
<h1>Tuff Sound Uploader For Guesting Hub</h1>
<h2>Make sure sounds are mp3, ogg, wav</h2>

<form id="f">
  <input type="file" name="file" required />
  <button type="submit">Upload</button>
</form>

<input id="linkBox" readonly />
<button id="copyBtn">Copy Link</button>
<div id="copyNote">Copy this and paste on the Custom LMS inside</div>

<script>
const f=document.getElementById("f"),linkBox=document.getElementById("linkBox"),copyBtn=document.getElementById("copyBtn"),copyNote=document.getElementById("copyNote");
f.onsubmit=async e=>{
  e.preventDefault();
  try{
    const res=await fetch("/api/upload",{method:"POST",body:new FormData(f)});
    if(!res.ok) throw new Error("Upload failed");
    const url=await res.text();
    linkBox.value=url; linkBox.style.display="block";
    copyBtn.style.display="block"; copyNote.style.display="block";
  }catch(err){alert(err);}
};
copyBtn.onclick=()=>{linkBox.select();linkBox.setSelectionRange(0,99999);document.execCommand("copy");copyBtn.innerText="Copied!";setTimeout(()=>{copyBtn.innerText="Copy Link"},2000);};
</script>
</body>
</html>
