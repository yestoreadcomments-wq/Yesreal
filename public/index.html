<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tuff Sound Uploader For Guesting hub</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#fff;color:#000;display:flex;flex-direction:column;align-items:center;padding:18px;box-sizing:border-box}
h1{font-size:1.4rem;margin:0 0 6px;text-align:center}
#note{font-size:.85rem;margin-bottom:12px;text-align:center}
form{width:92%;max-width:420px;display:flex;flex-direction:column;gap:10px}
input[type=file]{padding:14px;font-size:1rem}
button{padding:12px;font-size:1rem;cursor:pointer}
#linkBox,#copyBtn,#copyNote{display:none;width:100%;max-width:420px;margin-top:10px}
#linkBox{padding:8px;font-family:monospace;font-size:.9rem}
#copyBtn{padding:8px;font-size:.85rem}
#copyNote{font-size:.85rem;margin-top:6px}
</style>
</head>
<body>
<h1>Tuff Sound Uploader For Guesting hub</h1>
<div id="note">Make sure sounds are mp3, ogg, wav</div>

<form id="form" enctype="multipart/form-data">
  <input id="file" type="file" name="file" accept=".mp3,.ogg,.wav" required>
  <button type="submit">Upload</button>
</form>

<input id="linkBox" readonly>
<button id="copyBtn">Copy</button>
<div id="copyNote">Copy this and paste on the Custom LMS inside</div>

<script>
const form = document.getElementById('form');
const fileInput = document.getElementById('file');
const linkBox = document.getElementById('linkBox');
const copyBtn = document.getElementById('copyBtn');
const copyNote = document.getElementById('copyNote');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = fileInput.files[0];
  if (!f) { alert('Select a file'); return; }

  // small size guard
  const maxBytes = 24 * 1024 * 1024; // 24 MB
  if (f.size > maxBytes) {
    if (!confirm('File is large and may fail on upload. Continue?')) return;
  }

  const fd = new FormData();
  fd.append('file', f);

  try {
    const res = await fetch('/api/upload', { method: 'POST', body: fd });
    const text = await res.text();
    if (!res.ok) {
      alert('Upload failed: ' + text);
      return;
    }
    linkBox.value = text;
    linkBox.style.display = copyBtn.style.display = copyNote.style.display = 'block';
    // auto-select & copy (mobile-friendly)
    linkBox.select();
    linkBox.setSelectionRange(0, 99999);
  } catch (err) {
    alert('Upload failed (network): ' + err.message);
  }
});

copyBtn.addEventListener('click', () => {
  linkBox.select();
  document.execCommand('copy');
  copyBtn.innerText = 'Copied';
  setTimeout(()=>copyBtn.innerText = 'Copy',1500);
});
</script>
</body>
</html>
