<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tuff Sound Uploader For Guesting hub</title>
<style>
body{font-family:Arial;background:#fff;color:#000;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{text-align:center;font-size:1.5rem}
#note{text-align:center;font-size:.85rem;margin-top:5px}
form{width:90%;max-width:400px;display:flex;flex-direction:column;gap:12px;margin-top:25px}
input[type=file]{padding:15px;font-size:1rem}
button{padding:12px;font-size:.9rem}
#link,#copyBtn,#copyText{display:none;width:100%;max-width:400px;margin-top:10px}
#link{font-family:monospace;font-size:.9rem;padding:8px}
#copyBtn{padding:7px;font-size:.8rem}
#copyText{font-size:.8rem}
</style>
</head>
<body>

<h1>Tuff Sound Uploader For Guesting hub</h1>
<div id="note">Make sure sounds are mp3, ogg, wav</div>

<form id="a">
<input type="file" name="file" required>
<button type="submit">Upload</button>
</form>

<input id="link" readonly>
<button id="copyBtn">Copy</button>
<div id="copyText">Copy this and paste on the Custom LMS inside</div>

<script>
const a=document.getElementById("a"),
link=document.getElementById("link"),
copyBtn=document.getElementById("copyBtn"),
copyText=document.getElementById("copyText");

a.onsubmit=async e=>{
e.preventDefault();
const f=new FormData(a);
const r=await fetch('/api/upload', {method:'POST', body:f});
const txt=await r.text();
link.value=txt;
link.style.display=copyBtn.style.display=copyText.style.display='block';
};

copyBtn.onclick=()=>{
link.select();
document.execCommand('copy');
copyBtn.innerText="Copied";
setTimeout(()=>copyBtn.innerText="Copy",1500);
};
</script>

</body>
</html>
